<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            /* Gradient Latar Belakang */
            --bg-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.95);
            --nim-bg: #ecf0f1;
            --nim-text: #2c3e50;
            --fixed-bg: rgba(255, 255, 255, 0.85);
            --fixed-text: #2c3e50;
            /* Warna Kunang-Kunang (Kuning Keemasan) */
            --firefly-color: #ffeb3b; 
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --text-color: #e0e0e0;
            --card-bg: rgba(15, 52, 96, 0.95);
            --nim-bg: #1a1a2e;
            --nim-text: #bdc3c7;
            --fixed-bg: rgba(15, 52, 96, 0.85);
            --fixed-text: #e0e0e0;
            /* Warna Kunang-Kunang Mode Gelap (Lebih Neon) */
            --firefly-color: #76ff03;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative; 
        }

        /* ========================================= */
        /* --- ANIMASI KUNANG-KUNANG (FIREFLIES) --- */
        /* ========================================= */
        #fireflies-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Klik tembus ke bawah */
            z-index: 0; /* Di belakang konten tapi di depan background body */
            overflow: hidden;
        }

        .firefly {
            position: absolute;
            border-radius: 50%;
            background-color: var(--firefly-color);
            box-shadow: 0 0 10px var(--firefly-color), 0 0 20px var(--firefly-color); /* Efek Bersinar */
            opacity: 0;
            /* Animasi gabungan: Muncul/Hilang + Gerak X + Gerak Y */
            animation: 
                fadeGlow 3s infinite alternate, 
                moveX 12s infinite alternate ease-in-out, 
                moveY 9s infinite alternate ease-in-out;
        }

        /* Animasi Berkedip */
        @keyframes fadeGlow {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.1); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* Gerakan Horizontal Acak */
        @keyframes moveX {
            0% { transform: translateX(0); }
            100% { transform: translateX(100px); }
        }

        /* Gerakan Vertikal Acak */
        @keyframes moveY {
            0% { transform: translateY(0); }
            100% { transform: translateY(-80px); }
        }

        /* --- FIXED ELEMENTS (CREDIT, THEME, YOUTUBE) --- */
        .fixed-element {
            position: fixed; top: 20px; z-index: 1000;
            background: var(--fixed-bg); padding: 10px 20px;
            border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px); color: var(--fixed-text);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 14px; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        
        .pos-left { left: 20px; }
        .pos-right { right: 20px; }
        .pos-theme { right: 180px; width: 45px; height: 45px; padding: 0; cursor: pointer; border: none; font-size: 18px; }

        .pos-right i { color: #ff0000; font-size: 18px; margin-right: 8px; }
        .pos-theme i { color: #f1c40f; }
        body.dark-mode .pos-theme i { color: #f39c12; }

        /* --- UTAMA (LIST VIEW) --- */
        #main-view { 
            position: relative; 
            z-index: 10; /* Pastikan konten di atas kunang-kunang */
            transition: opacity 0.5s; 
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px 20px; padding-top: 100px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-weight: 600; color: #fff; margin-bottom: 5px; font-size: 2.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        p.subtitle { color: #ddd; margin-bottom: 25px; }
        
        .search-box { width: 100%; max-width: 500px; margin: 0 auto 30px auto; }
        .search-box input {
            width: 100%; padding: 15px 25px; border-radius: 50px; border: none;
            font-family: 'Poppins', sans-serif; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: var(--card-bg); color: var(--text-color);
        }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card {
            background: var(--card-bg); border-radius: 15px; padding: 25px;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s; border-top: 5px solid transparent; cursor: pointer;
            position: relative; overflow: hidden;
            backdrop-filter: blur(5px); /* Efek kaca sedikit agar background terlihat samar */
        }
        .card:hover { transform: translateY(-5px); border-top: 5px solid #3498db; box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        
        .gender-tag {
            position: absolute; top: 10px; right: 10px; font-size: 12px;
            padding: 2px 8px; border-radius: 10px; color: white; font-weight: bold;
        }
        .gender-L { background: #3498db; }
        .gender-P { background: #e91e63; }

        .avatar {
            width: 65px; height: 65px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; margin: 0 auto 10px auto;
        }
        .card h3 { font-size: 17px; font-weight: 600; color: var(--text-color); min-height: 50px; display: flex; align-items: center; justify-content: center; }
        .nim-badge { background: var(--nim-bg); color: var(--nim-text); padding: 4px 12px; border-radius: 15px; font-size: 13px; font-weight: 500; }

        /* --- PROFIL VIEW (GALAXY BACKGROUND) --- */
        #profile-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2000; display: none; opacity: 0;
            transition: opacity 0.5s ease;
            overflow-y: auto;
            background: rgba(0,0,0,0.8); /* Gelapkan background saat masuk profil */
        }

        .galaxy-bg {
            /* Kita gunakan kunang-kunang global saja agar konsisten, 
               tapi jika ingin bintang tambahan khusus profil, ini tetap ada */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        .stars {
            width: 1px; height: 1px; background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF;
            animation: animStar 50s linear infinite;
        }
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }

        .profile-content {
            position: relative; width: 100%; min-height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        .back-btn-float {
            position: fixed; top: 20px; left: 20px; z-index: 2001;
            background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
            color: white; padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .back-btn-float:hover { background: white; color: #000; }

        .big-profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px; border-radius: 30px;
            text-align: center; color: white;
            width: 100%; max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.4s ease;
        }
        
        .big-avatar {
            width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px auto;
            background: linear-gradient(45deg, #ff00cc, #333399);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: bold; border: 4px solid rgba(255,255,255,0.5);
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.4);
        }

        .info-row {
            display: flex; justify-content: space-between; padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #aaa; text-align: left; }
        .info-val { font-weight: 600; text-align: right; }

        .jodoh-btn {
            margin-top: 30px; width: 100%; padding: 15px;
            background: linear-gradient(90deg, #ff512f, #dd2476);
            border: none; border-radius: 50px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(221, 36, 118, 0.4);
            transition: transform 0.2s; position: relative; overflow: hidden;
        }
        .jodoh-btn:hover { transform: scale(1.05); }

        /* --- MODAL JODOH --- */
        .jodoh-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .jodoh-modal.active { opacity: 1; visibility: visible; }
        
        .heart-beat { font-size: 60px; color: #e91e63; animation: heartbeat 1s infinite; margin-bottom: 20px; }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .match-result-box {
            background: white; padding: 30px; border-radius: 20px; width: 300px; text-align: center;
        }
        .match-name { font-size: 24px; font-weight: bold; color: #2c3e50; margin: 15px 0; min-height: 60px; display: flex; align-items: center; justify-content: center;}
        .match-class { font-size: 14px; color: #7f8c8d; background: #ecf0f1; padding: 5px 10px; border-radius: 10px; display: inline-block;}
        .close-match { margin-top: 20px; background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer;}

        /* --- KELAS SELECTION MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box {
            background: var(--card-bg); padding: 40px; border-radius: 20px;
            text-align: center; max-width: 90%; width: 400px; transform: scale(0.8); transition: 0.3s;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .choice-btn {
            padding: 15px 30px; border: none; border-radius: 12px; font-size: 18px; font-weight: 600;
            cursor: pointer; color: white; margin: 0 10px;
        }
        .btn-if1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .btn-if2 { background: linear-gradient(135deg, #ff9966 0%, #ff5e62 100%); }

        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Media Query Mobile */
        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; padding: 0 10px; }
            .search-box { padding: 0 10px; }
            .pos-left { font-size: 10px; padding: 6px 10px; left: 10px; top: 15px; width: auto; max-width: 150px; }
            .pos-right { font-size: 0; padding: 8px 12px; right: 10px; top: 15px; }
            .pos-right i { margin: 0; font-size: 18px; }
            .pos-theme { right: 75px; width: 35px; height: 35px; font-size: 16px; top: 15px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>

<div id="main-view">

    dataIF2.forEach(s => allStudents.push({...s, class: "IF 2"}));

    let currentClassData = [];
    let currentClassLabel = "";
    let currentProfile = null;

    window.onload = function() {
        document.getElementById('selectionModal').classList.add('active');
        createStars(); // Bintang Profil
        createFireflies(); // Kunang-Kunang Global
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('#themeToggle i').classList.replace('fa-moon', 'fa-sun');
        }
    };

    // --- FUNGSI KUNANG-KUNANG ---
    function createFireflies() {
        const container = document.getElementById('fireflies-container');
        const count = 50; // Jumlah banyak

        for(let i=0; i<count; i++){
            const fly = document.createElement('div');
            fly.classList.add('firefly');
            
            // Posisi Awal Acak
            fly.style.left = Math.random() * 100 + 'vw';
            fly.style.top = Math.random() * 100 + 'vh';
            
            // Ukuran Sedang (4px - 8px)
            const size = Math.random() * 4 + 4; 
            fly.style.width = size + 'px';
            fly.style.height = size + 'px';
            
            // Kecepatan Animasi Acak (agar tidak seragam)
            const durationX = Math.random() * 10 + 10 + 's';
            const durationY = Math.random() * 10 + 10 + 's';
            fly.style.animationDuration = `3s, ${durationX}, ${durationY}`;
            
            // Delay Acak
            fly.style.animationDelay = `-${Math.random() * 20}s`;
            
            container.appendChild(fly);
        }
    }

    function createStars() {
        const starContainer = document.getElementById('stars');
        let boxShadow = "";
        for(let i=0; i<300; i++){
            let x = Math.floor(Math.random() * 2000);
            let y = Math.floor(Math.random() * 2000);
            boxShadow += `${x}px ${y}px #FFF, `;
        }
        starContainer.style.boxShadow = boxShadow.slice(0, -2);
    }

    function getInitials(name) {
        let parts = name.split(" ");
        return parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].substring(0, 2).toUpperCase();
    }

    function loadClassData(type) {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = "";
        
        if (type === 'IF1') {
            currentClassData = dataIF1;
            currentClassLabel = "IF 1";
        } else {
            currentClassData = dataIF2;
            currentClassLabel = "IF 2";
        }

        document.getElementById('class-name').innerText = currentClassLabel;

        currentClassData.forEach((student) => {
            const initial = getInitials(student.name);
            const genderClass = student.gender === 'L' ? 'gender-L' : 'gender-P';
            const genderLabel = student.gender === 'L' ? 'L' : 'P';
            
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openProfile(student);
            card.innerHTML = `
                <div class="gender-tag ${genderClass}">${genderLabel}</div>
                <div class="avatar">${initial}</div>
                <h3>${student.name}</h3>
                <span class="nim-badge">${student.nim}</span>
            `;
            grid.appendChild(card);
        });

        document.getElementById('selectionModal').classList.remove('active');
    }

    function openProfile(student) {
        currentProfile = student; 
        
        document.getElementById('p-avatar').innerText = getInitials(student.name);
        document.getElementById('p-name').innerText = student.name;
        document.getElementById('p-nim').innerText = student.nim;
        document.getElementById('p-class').innerText = currentClassLabel;
        document.getElementById('p-gender').innerText = student.gender === 'L' ? 'Laki-Laki' : 'Perempuan';
        document.getElementById('p-dob').innerText = student.dob;
        document.getElementById('p-dospem').innerText = student.dospem;

        document.getElementById('main-view').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('main-view').style.display = 'none';
            const pView = document.getElementById('profile-view');
            pView.style.display = 'block';
            setTimeout(() => { pView.style.opacity = '1'; }, 50);
        }, 300);
    }

    function closeProfile() {
        const pView = document.getElementById('profile-view');
        pView.style.opacity = '0';
        setTimeout(() => {
            pView.style.display = 'none';
            const mView = document.getElementById('main-view');
            mView.style.display = 'block';
            setTimeout(() => { mView.style.opacity = '1'; }, 50);
        }, 500);
    }

    let matchInterval;

    function cekJodoh() {
        if (!currentProfile) return;

        const myGender = currentProfile.gender;
        const targetGender = myGender === 'L' ? 'P' : 'L'; 

        const candidates = allStudents.filter(s => s.gender === targetGender);

        if (candidates.length === 0) {
            alert("Waduh, belum ada data lawan jenis di database!");
            return;
        }

        const modal = document.getElementById('jodohModal');
        const nameDisplay = document.getElementById('match-name-display');
        const classDisplay = document.getElementById('match-class-display');
        modal.classList.add('active');

        let counter = 0;
        matchInterval = setInterval(() => {
            const randomCandidate = candidates[Math.floor(Math.random() * candidates.length)];
            nameDisplay.innerText = randomCandidate.name;
            classDisplay.innerText = "Mencari...";
            nameDisplay.style.color = "#ccc"; 
            counter++;
        }, 100); 

        setTimeout(() => {
            clearInterval(matchInterval);
            const finalMatch = candidates[Math.floor(Math.random() * candidates.length)];
            
            nameDisplay.innerText = finalMatch.name;
            nameDisplay.style.color = "#2c3e50"; 
            classDisplay.innerText = finalMatch.class;
            
            nameDisplay.style.transform = "scale(1.2)";
            setTimeout(()=> nameDisplay.style.transform = "scale(1)", 200);

        }, 3000);
    }

    function closeJodoh() {
        document.getElementById('jodohModal').classList.remove('active');
        clearInterval(matchInterval); 
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const icon = document.querySelector('#themeToggle i');
        if (document.body.classList.contains('dark-mode')) {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
            localStorage.setItem('theme', 'dark');
        } else {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
            localStorage.setItem('theme', 'light');
        }
    }

    function filterNames() {
        var input, filter, cards, h3, nim, txtValue, nimValue;
        input = document.getElementById("searchInput");
        filter = input.value.toUpperCase();
        const grid = document.getElementById("cardGrid");
        cards = grid.getElementsByClassName("card");

        for (let i = 0; i < cards.length; i++) {
            h3 = cards[i].getElementsByTagName("h3")[0];
            nim = cards[i].getElementsByClassName("nim-badge")[0];
            txtValue = h3.textContent || h3.innerText;
            nimValue = nim.textContent || nim.innerText;
            if (txtValue.toUpperCase().indexOf(filter) > -1 || nimValue.toUpperCase().indexOf(filter) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
